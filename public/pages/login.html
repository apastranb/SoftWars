<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoftWars - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="icon" type="image/svg" href="../img/CENFOTEC-FAVICON.svg">
</head>
<body>
    <div class="login-container">
        <a href="../index.html" class="login-back-home">
            <i class="bi bi-arrow-left"></i> Volver al inicio
        </a>

        <div class="login-box">
            <div class="login-logo">
                <img src="../img/eventos-cenfotec-logo-dark.svg" alt="SoftWars Eventos CENFOTEC" class="img-fluid">
            </div>

            <h2>Iniciar Sesión</h2>
            <p class="login-subtitle">Panel de Administración</p>

            <!-- Mensaje general (credenciales inválidas, cuenta inactiva, etc.) -->
            <span class="form__error-message" id="error-login"></span>

            <form id="form-login" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" autocomplete="username" placeholder="correo@ucenfotec.ac.cr">
                    <span class="form__error-message" id="error-email"></span>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control" autocomplete="current-password" placeholder="••••••••">
                    <span class="form__error-message" id="error-password"></span>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-submit">Ingresar</button>
            </form>

            <div class="login-actions mt-3">
                <!-- HU-04: Modificar Contraseña -->
                <a href="#" id="link-forgot-pass">Modificar Contraseña</a>
            </div>
        </div>
    </div>

    <!-- HU-04: Modal Modificar Contraseña -->
    <div class="modal-overlay" id="modalCambiarPass">
        <div class="custom-modal">
            <div class="custom-modal__header">
                <h2>Modificar Contraseña</h2>
                <button class="custom-modal__close" id="btnCerrarCambiarPass" type="button">&times;</button>
            </div>
            <div class="custom-modal__body">
                <div class="mb-3">
                    <label for="cp-email" class="form-label">Correo Electrónico</label>
                    <input type="email" id="cp-email" class="form-control" placeholder="correo@ucenfotec.ac.cr">
                    <span class="form__error-message" id="error-cp-email"></span>
                </div>
                <div class="mb-3">
                    <label for="cp-actual" class="form-label">Contraseña Actual</label>
                    <input type="password" id="cp-actual" class="form-control" placeholder="••••••••">
                    <span class="form__error-message" id="error-cp-actual"></span>
                </div>
                <div class="mb-3">
                    <label for="cp-nueva" class="form-label">Nueva Contraseña</label>
                    <input type="password" id="cp-nueva" class="form-control" placeholder="••••••••">
                    <span class="form__error-message" id="error-cp-nueva"></span>
                </div>
                <div class="mb-3">
                    <label for="cp-confirmar" class="form-label">Confirmar Nueva Contraseña</label>
                    <input type="password" id="cp-confirmar" class="form-control" placeholder="••••••••">
                    <span class="form__error-message" id="error-cp-confirmar"></span>
                </div>
                <p class="modal-hint">La contraseña debe tener entre 8 y 16 caracteres, sin vocales, e incluir al menos una mayúscula, una minúscula, un número y un carácter especial.</p>
                <span class="form__result-message" id="resultado-cambiar-pass"></span>
            </div>
            <div class="custom-modal__footer">
                <button class="modal-btn-cancelar" id="btnCancelarCambiarPass" type="button">Cancelar</button>
                <button class="modal-btn-registrar" id="btnCambiarPass" type="button">Guardar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/data-store.js"></script>
    <script src="../js/validaciones.js"></script>
    <script src="../js/login-logic.js"></script>
</body>
</html>
