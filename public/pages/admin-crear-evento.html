<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Evento</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/admin-layout.css" />
    <link rel="stylesheet" href="../css/admin-crear-evento.css" />
    <link rel="icon" type="image/svg" href="../img/CENFOTEC-FAVICON.svg">
  </head>
  <body>
    <!--MENU LATERAL-->
    <nav class="navSideMenu">
      <div class="sideMenuHeader">
        <div>
          <img src="../img/eventos-cenfotec-icon-dark.png" alt="Logo CENFOTEC" />
        </div>
        <div>
          <h2>Panel de Administrador</h2>
          <p>Gestión Académica</p>
        </div>
      </div>

      <hr class="menuSeparator" />

      <div class="sideMenuLinks">
        <a href="admin-eventos.html"><i class="bi bi-calendar"></i> Eventos</a>
        <a href="admin-actividades.html"
          ><i class="bi bi-list-task"></i> Actividades</a
        >
        <a href="admin-oradores.html"
          ><i class="bi bi-people-fill"></i> Presentadores</a
        >
        <a href="admin-stands.html"><i class="bi bi-shop-window"></i> Stands</a>
        <a href="admin-participantes.html"><i class="bi bi-person-check"></i> Participantes</a>
        <a href="admin-usuarios.html"
          ><i class="bi bi-key"></i> Administradores</a
        >
      </div>

      <div class="sideMenuLinks">
        <hr class="menuSeparator" />
        <a href="../index.html" target="_blank"><i class="bi bi-house"></i> Sitio Público</a>
        <a id="btnLogOut" href="login.html"
          ><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a
        >
      </div>
    </nav>

    <div class="admin-main-content">
      <header>
        <div class="headerTitle">
          <h1>Crear Nuevo Evento</h1>
          <nav aria-label="breadcrumb" class="page-breadcrumb">
            <ol class="page-breadcrumb">
              <li class="page-breadcrumb-item">
                <a href="admin-eventos.html">Eventos</a>
              </li>
              <li class="page-breadcrumb-item" aria-current="page">Crear Evento</li>
            </ol>
          </nav>
        </div>
      </header>

      <main>
        <section class="newEventFormSection">
          <form id="formCrearEvento" novalidate>
            <div class="form-card newEventUploadImg">
              <h2><i class="bi bi-image"></i> Imagen de Portada</h2>
              <label class="upload-area" id="uploadArea" for="portadaEvento">
                <i class="bi bi-cloud-arrow-up"></i>
                <p>Haz clic para subir o arrastra un archivo PNG o JPG</p>
                <input
                  type="file"
                  id="portadaEvento"
                  accept="image/png, image/jpeg"
                  hidden
                />
                <img
                  id="previewPortada"
                  class="preview-portada"
                  src=""
                  alt="Vista previa de la portada"
                />
              </label>
            </div>

            <div class="form-card newEventDetails">
              <h2>
                <i class="bi bi-card-text"></i> Información del Evento Principal
              </h2>

              <div class="form-grid">
                <div class="input-group full-width">
                  <label for="nombreEvento">Nombre del Evento</label>
                  <input
                    type="text"
                    id="nombreEvento"
                    placeholder="Ej. Congreso de Tecnología"
                  />
                  <span
                    class="form__error-message"
                    id="error-nombreEvento"
                  ></span>
                </div>

                <div class="input-group">
                  <label for="categoriaEvento">Categoría</label>
                  <select id="categoriaEvento">
                    <option value="" disabled selected>
                      Seleccione una categoría
                    </option>
                    <option value="Artísticas">Artísticas</option>
                    <option value="Culturales">Culturales</option>
                    <option value="Deportivas">Deportivas</option>
                    <option value="Recreación">Recreación</option>
                    <option value="Tecnológicas">Tecnológicas</option>
                    <option value="Voluntariado">Voluntariado</option>
                  </select>
                  <span
                    class="form__error-message"
                    id="error-categoriaEvento"
                  ></span>
                </div>

                <div class="input-group">
                  <label for="cupoEvento">Cupo Máximo</label>
                  <input
                    type="number"
                    id="cupoEvento"
                    placeholder="Ej. 150"
                    min="1"
                  />
                  <span
                    class="form__error-message"
                    id="error-cupoEvento"
                  ></span>
                </div>

                <div class="input-group full-width">
                  <div class="label-with-action">
                    <label for="descEvento">Descripción del Evento</label>
                    <button
                      type="button"
                      class="btn-ai-enhance"
                      id="btnMejorarDesc"
                    >
                      <i class="bi bi-stars"></i> Mejorar con IA
                    </button>
                  </div>
                  <textarea
                    id="descEvento"
                    rows="4"
                    placeholder="Describe los detalles principales..."
                  ></textarea>
                  <span
                    class="form__error-message"
                    id="error-descEvento"
                  ></span>
                </div>
              </div>
            </div>

            <div class="form-card newEventLogistic">
              <h2><i class="bi bi-geo-alt"></i> Logística y Ubicación</h2>

              <div class="form-grid">
                <div class="input-group">
                  <label for="fechaInicioEvento">Fecha de Inicio</label>
                  <input type="date" id="fechaInicioEvento"/>
                  <span
                    class="form__error-message"
                    id="error-fechaInicioEvento"
                  ></span>
                </div>
                <div class="input-group">
                  <label for="fechaFinEvento">Fecha de Finalización</label>
                  <input type="date" id="fechaFinEvento"/>
                  <span
                    class="form__error-message"
                    id="error-fechaFinEvento"
                  ></span>
                </div>
                <div class="input-group full-width">
                  <label for="lugarEvento">Lugar / Sala</label>
                  <input
                    type="text"
                    id="lugarEvento"
                    placeholder="Ej. Auditorio Principal"
                  />
                  <span
                    class="form__error-message"
                    id="error-lugarEvento"
                  ></span>
                </div>
                <div class="input-group">
                  <label for="horaInicio">Hora de Inicio</label>
                  <input type="time" id="horaInicio"/>
                  <span
                    class="form__error-message"
                    id="error-horaInicio"
                  ></span>
                </div>
                <div class="input-group">
                  <label for="horaFin">Hora de Finalización</label>
                  <input type="time" id="horaFin"/>
                  <span class="form__error-message" id="error-horaFin"></span>
                </div>
                <div class="input-group full-width">
                  <label for="responsableEvento">Admin Responsable</label>
                  <input
                    type="text"
                    id="responsableEvento"
                    placeholder="Nombre del administrador a cargo del evento"
                  />
                  <span
                    class="form__error-message"
                    id="error-responsableEvento"
                  ></span>
                </div>
              </div>

              <div class="radio-groups-container">
                <fieldset class="radio-group">
                  <legend class="radio-title">Tipo de Entrada</legend>
                  <div class="radio-options">
                    <label>
                      <input
                        type="radio"
                        name="tipoEntrada"
                        value="libre"
                      />
                      Entrada Libre
                    </label>
                    <label>
                      <input type="radio" name="tipoEntrada" value="pago" />
                      De Pago
                    </label>
                  </div>
                  <span class="form__error-message" id="error-tipoEntrada"></span>
                </fieldset>

                <fieldset class="radio-group">
                  <legend class="radio-title">Visibilidad</legend>
                  <div class="radio-options">
                    <label>
                      <input
                        type="radio"
                        name="visibilidad"
                        value="publico"
                      />
                      Público
                    </label>
                    <label>
                      <input type="radio" name="visibilidad" value="privado" />
                      Privado
                    </label>
                  </div>
                  <span class="form__error-message" id="error-visibilidad"></span>
                </fieldset>
              </div>
            </div>

            <div class="newEventButtons">
              <button
                type="button"
                class="eventsAdminBtnSecondary btnDelete"
                id="newEventCancel"
              >
                Cancelar
              </button>
              <button
                type="submit"
                class="eventsAdminBtnPrimary"
                id="publicarEvento"
              >
                Publicar Evento
              </button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/validaciones.js"></script>
    <script type="module" src="../js/controllers/adminCrearEventoController.js"></script>
  </body>
</html>
