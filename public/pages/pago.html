<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago - SoftWars</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/pago.css">
    <link rel="icon" type="image/svg" href="../img/CENFOTEC-FAVICON.svg">
</head>
<body class="pago-bg">

    <div class="min-vh-100 d-flex align-items-center justify-content-center py-4 px-3">
        <div class="card shadow pago-card w-100" style="max-width: 480px;">
            <div class="card-body p-4">

                <!-- Ícono superior -->
                <div class="text-center mb-3">
                    <div class="pago-icon d-inline-flex align-items-center justify-content-center">
                        <span>&#10095;</span>
                    </div>
                </div>

                <h2 class="pago-titulo text-center mb-4">Datos de Pago</h2>

                <!-- Actividad -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Actividad:</label>
                    <p id="pagoActividadNombre" class="pago-info-text mb-0">—</p>
                </div>

                <hr>

                <!-- Número de tarjeta -->
                <div class="mb-3">
                    <label for="pagoNumTarjeta" class="form-label">Número de tarjeta</label>
                    <input type="text" id="pagoNumTarjeta" class="form-control"
                           placeholder="1234 5678 9012 3456"
                           maxlength="19" inputmode="numeric" autocomplete="cc-number">
                    <span class="pago-error" id="errorNumTarjeta"></span>
                </div>

                <!-- Nombre -->
                <div class="mb-3">
                    <label for="pagoNombre" class="form-label">Nombre (como figura en la tarjeta)</label>
                    <input type="text" id="pagoNombre" class="form-control"
                           placeholder="Juan Pérez" autocomplete="cc-name">
                    <span class="pago-error" id="errorNombre"></span>
                </div>

                <!-- Vencimiento + CVV -->
                <div class="row g-3 mb-3">
                    <div class="col-7">
                        <label class="form-label">Vencimiento</label>
                        <div class="d-flex gap-2">
                            <select id="pagoMes" class="form-select">
                                <option value="01">01</option>
                                <option value="02">02</option>
                                <option value="03">03</option>
                                <option value="04">04</option>
                                <option value="05">05</option>
                                <option value="06">06</option>
                                <option value="07">07</option>
                                <option value="08">08</option>
                                <option value="09">09</option>
                                <option value="10" selected>10</option>
                                <option value="11">11</option>
                                <option value="12">12</option>
                            </select>
                            <select id="pagoAnio" class="form-select">
                                <option value="2026" selected>2026</option>
                                <option value="2027">2027</option>
                                <option value="2028">2028</option>
                                <option value="2029">2029</option>
                                <option value="2030">2030</option>
                                <option value="2031">2031</option>
                            </select>
                        </div>
                        <span class="pago-error" id="errorVencimiento"></span>
                    </div>
                    <div class="col-5">
                        <label for="pagoCVV" class="form-label">Código de seguridad</label>
                        <input type="text" id="pagoCVV" class="form-control"
                               placeholder="CVV" maxlength="4"
                               inputmode="numeric" autocomplete="cc-csc">
                        <span class="pago-error" id="errorCVV"></span>
                    </div>
                </div>

                <!-- Botones -->
                <div class="d-grid gap-2 mt-4">
                    <button class="btn btn-primary pago-btn" id="btnConfirmarPago">CONFIRMAR</button>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary">Cancelar</a>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/data-store.js"></script>
    <script src="../js/validaciones.js"></script>
    <script src="../js/pago-logic.js"></script>
</body>
</html>
