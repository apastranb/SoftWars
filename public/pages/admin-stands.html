<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Stands</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/admin-layout.css">
    <link rel="icon" type="image/svg" href="../img/CENFOTEC-FAVICON.svg">
</head>

<body>

    <!--MENU LATERAL-->
    <nav class="navSideMenu">
        <div class="sideMenuHeader">
            <div>
                <img src="../img/eventos-cenfotec-icon-dark.png" alt="" />
            </div>
            <div>
                <h2>Panel de Administrador</h2>
                <p>Gestión Académica</p>
            </div>
        </div>

        <hr class="menuSeparator" />

        <div class="sideMenuLinks">
            <a href="admin-eventos.html"><i class="bi bi-calendar"></i> Eventos</a>
            <a href="admin-actividades.html"><i class="bi bi-list-task"></i> Actividades</a>
            <a href="admin-oradores.html"><i class="bi bi-people-fill"></i> Presentadores</a>
            <a class="sideMenuActive" href="admin-stands.html"><i class="bi bi-shop-window"></i> Stands</a>
            <a href="admin-participantes.html"><i class="bi bi-person-check"></i> Participantes</a>
            <a href="admin-usuarios.html"><i class="bi bi-key"></i> Administradores</a>
        </div>

        <div class="sideMenuLinks">
            <hr class="menuSeparator" />
            <a href="../index.html" target="_blank"><i class="bi bi-house"></i> Sitio Público</a>
            <a id="btnLogOut" href="login.html"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="admin-main-content">

        <!-- Header / Topbar -->
        <header>
            <div class="headerTitle">
                <h1>Gestión de Stands</h1>
            </div>
            <div class="headerActions">
                <div class="headerSearchBar">
                    <button type="button"><i class="bi bi-search"></i></button>
                    <input type="text" placeholder="Buscar stand..." id="searchStandInput">
                </div>
                <div class="headerAdminInfo">
                    <p class="userName" id="headerUserName">Nombre Admin</p>
                    <p class="userRol" id="headerUserRol">Rol</p>
                </div>
            </div>
        </header>

        <main class="admin-page-content">

            <section class="admin-toolbar">
                <div class="admin-toolbar__filters">
                    <select class="filter-select" id="filterEstadoStand">
                        <option value="">Estado</option>
                        <option value="aprobado">Aprobado</option>
                        <option value="cerrado">Cerrado</option>
                    </select>
                    <select class="filter-select" id="filterCategoriaStand">
                        <option value="">Categoría</option>
                        <option value="empresa">Empresa</option>
                        <option value="personal">Personal</option>
                    </select>
                </div>
                <div class="admin-toolbar__actions">
                    <button class="eventsAdminBtnSecondary" id="btnEditarStand">Editar</button>
                    <button class="eventsAdminBtnSecondary btnDelete" id="btnEliminarStand">Eliminar</button>
                    <button class="eventsAdminBtnPrimary" id="btnCrearStand"><i class="bi bi-plus-lg"></i> Crear Stand</button>
                </div>
            </section>

            <section class="admin-table-wrapper">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="selectAll" title="Seleccionar todos"></th>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Encargado</th>
                            <th>Empresa / Personal</th>
                            <th>Correo</th>
                            <th>Teléfono</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="standsTableBody">
                        <!-- Renderizado dinámicamente por JS -->
                    </tbody>
                </table>
                <p class="tabla-vacia oculto" id="tabla-vacia">No se encontraron stands.</p>
            </section>

        </main>
    </div>

    <!-- MODAL REGISTRAR / EDITAR STAND -->
    <div class="modal-overlay" id="modalCrearStand">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalStandTitulo">Registrar Stand</h2>
                <button class="modal-close" id="btnCerrarModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-field">
                    <label for="inputEventoStand">Evento al que pertenece</label>
                    <select id="inputEventoStand" class="filter-select modal-select-full">
                        <option value="">Seleccionar evento...</option>
                    </select>
                    <span class="form__error-message" id="error-inputEventoStand"></span>
                </div>
                <div class="modal-field">
                    <label for="inputNombreStand">Nombre del Stand</label>
                    <input type="text" id="inputNombreStand" placeholder="Ej. Stand Alpha">
                    <span class="form__error-message" id="error-inputNombreStand"></span>
                </div>
                <div class="modal-field">
                    <label for="inputCategoriaStand">Categoría</label>
                    <select id="inputCategoriaStand" class="filter-select modal-select-full">
                        <option value="">Seleccionar categoría...</option>
                        <option value="empresa">Empresa</option>
                        <option value="personal">Personal</option>
                    </select>
                    <span class="form__error-message" id="error-inputCategoriaStand"></span>
                </div>
                <div class="modal-field">
                    <label for="inputDescStand">Descripción</label>
                    <textarea id="inputDescStand" rows="3" placeholder="Breve descripción del stand (máx. 200 caracteres)"></textarea>
                    <span class="form__error-message" id="error-inputDescStand"></span>
                </div>
                <div class="modal-field">
                    <label for="inputEncargadoStand">Nombre del Encargado</label>
                    <input type="text" id="inputEncargadoStand" placeholder="Nombre completo">
                    <span class="form__error-message" id="error-inputEncargadoStand"></span>
                </div>
                <div class="modal-field">
                    <label for="inputEmpresaStand">Nombre de Empresa / Personal</label>
                    <input type="text" id="inputEmpresaStand" placeholder="Nombre de la empresa o persona">
                    <span class="form__error-message" id="error-inputEmpresaStand"></span>
                </div>
                <div class="modal-field">
                    <label for="inputCorreoStand">Correo del Encargado</label>
                    <input type="email" id="inputCorreoStand" placeholder="correo@empresa.com">
                    <span class="form__error-message" id="error-inputCorreoStand"></span>
                </div>
                <div class="modal-field">
                    <label for="inputTelefonoStand">Teléfono del Encargado</label>
                    <input type="text" id="inputTelefonoStand" placeholder="8888-8888">
                    <span class="form__error-message" id="error-inputTelefonoStand"></span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn-cancelar" id="btnCancelarModal">Cancelar</button>
                <button class="modal-btn-registrar" id="btnGuardarStand">Registrar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/data-store.js"></script>
    <script src="../js/validaciones.js"></script>
    <script src="../js/admin-stands-logic.js"></script>
</body>
</html>
