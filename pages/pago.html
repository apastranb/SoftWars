<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/pago.css">
    <link rel="icon" type="image/svg" href="../img/CENFOTEC-FAVICON.svg">
</head>
<body>

    <div class="pago-overlay">
        <div class="pago-card">

            <!-- Ícono superior -->
            <div class="pago-icon">
                <span>&#10095;</span>
            </div>

            <h2 class="pago-titulo">Datos de Pago</h2>

            <!-- Info del evento (se llena dinámicamente desde la página anterior) -->
            <div class="pago-field">
                <label>Actividad:</label>
                <p id="pagoActividadNombre" class="pago-info-text">—</p>
            </div>

            <!-- Número de tarjeta -->
            <div class="pago-field">
                <label for="pagoNumTarjeta">Número de tarjeta:</label>
                <input type="text" id="pagoNumTarjeta" placeholder="1234 5678 9012 3456" maxlength="19" inputmode="numeric" autocomplete="cc-number">
                <span class="pago-error" id="errorNumTarjeta"></span>
            </div>

            <!-- Nombre -->
            <div class="pago-field">
                <label for="pagoNombre">Nombre (como figura en la tarjeta):</label>
                <input type="text" id="pagoNombre" placeholder="Juan Pérez" autocomplete="cc-name">
                <span class="pago-error" id="errorNombre"></span>
            </div>

            <!-- Vencimiento + CVV -->
            <div class="pago-row">
                <div class="pago-field">
                    <label>Vencimiento:</label>
                    <div class="pago-expiry">
                        <select id="pagoMes">
                            <option value="01">01</option>
                            <option value="02">02</option>
                            <option value="03">03</option>
                            <option value="04">04</option>
                            <option value="05">05</option>
                            <option value="06">06</option>
                            <option value="07">07</option>
                            <option value="08">08</option>
                            <option value="09">09</option>
                            <option value="10" selected>10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                        </select>
                        <select id="pagoAnio">
                            <option value="2026" selected>2026</option>
                            <option value="2027">2027</option>
                            <option value="2028">2028</option>
                            <option value="2029">2029</option>
                            <option value="2030">2030</option>
                            <option value="2031">2031</option>
                        </select>
                    </div>
                    <span class="pago-error" id="errorVencimiento"></span>
                </div>

                <div class="pago-field pago-cvv">
                    <label for="pagoCVV">Código de seguridad:</label>
                    <input type="text" id="pagoCVV" placeholder="CVV" maxlength="4" inputmode="numeric" autocomplete="cc-csc">
                    <span class="pago-error" id="errorCVV"></span>
                </div>
            </div>

            <!-- Botones -->
            <button class="pago-btn" id="btnConfirmarPago">CONFIRMAR</button>
            <a href="javascript:history.back()" class="pago-btn-cancelar">Cancelar</a>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/data-store.js"></script>
    <script src="../js/validaciones.js"></script>
    <script src="../js/pago-logic.js"></script>
</body>
</html>
