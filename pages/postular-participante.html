<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postularse como Presentador</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/postular-participante.css" />
    <link rel="icon" type="image/svg" href="../img/CENFOTEC-FAVICON.svg">
</head>
<body>

    <nav>
        <div class="navLogo">
            <a href="../index.html">
                <img src="../img/eventos-cenfotec-logo-dark.svg" alt="Eventos CENFOTEC" />
            </a>
        </div>
        <div class="navLinks">
            <a href="../index.html">Eventos</a>
            <a class="active" href="postular-participante.html">Postularse</a>
        </div>
        <div class="navLinks">
            <div class="navbarSearch">
                <button id="searchButtonIndex"><i class="bi bi-search"></i></button>
                <input type="text" placeholder="Buscar eventos..." id="searchInput" />
            </div>
            <a href="login.html">Acceso Admin</a>
        </div>
    </nav>

    <div class="public-container">
        <main class="form-container">

            <section id="panel-postulacion">
                <h2>Postularse como Presentador / Orador</h2>
                <p>Completa tus datos para solicitar participar como responsable de una actividad (charla, taller, conferencia, etc.). Un administrador revisará tu solicitud.</p>

                <span class="form__error-message" id="error-general"></span>
                <span class="form__result-message" id="resultado-postulacion"></span>

                <form id="form-postulacion" novalidate>
                    <div class="form-group">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" placeholder="Juan Pérez">
                        <span class="form__error-message" id="error-nombre"></span>
                    </div>

                    <div class="form-group-row">
                        <div class="form-group">
                            <label for="correo">Correo Electrónico</label>
                            <input type="email" id="correo" placeholder="correo@dominio.com">
                            <span class="form__error-message" id="error-correo"></span>
                        </div>
                        <div class="form-group">
                            <label for="telefono">Teléfono Principal</label>
                            <input type="text" id="telefono" placeholder="8888-8888">
                            <span class="form__error-message" id="error-telefono"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="telefono2">Teléfono Secundario <span class="field-hint">(opcional)</span></label>
                        <input type="text" id="telefono2" placeholder="7777-7777">
                        <span class="form__error-message" id="error-telefono2"></span>
                    </div>

                    <div class="form-group">
                        <label for="especialidad">Área / Especialidad</label>
                        <input type="text" id="especialidad" placeholder="Ej. Inteligencia Artificial">
                        <span class="form__error-message" id="error-especialidad"></span>
                    </div>

                    <div class="form-group">
                        <label for="organizacion">Institución u Organización</label>
                        <input type="text" id="organizacion" placeholder="Ej. Universidad CENFOTEC">
                        <span class="form__error-message" id="error-organizacion"></span>
                    </div>

                    <div class="form-group">
                        <label for="biografia">Biografía</label>
                        <textarea id="biografia" rows="3" placeholder="Breve descripción de tu experiencia y trayectoria (máx. 200 caracteres)"></textarea>
                        <span class="form__error-message" id="error-biografia"></span>
                    </div>

                    <div class="form-group">
                        <label for="foto">Fotografía</label>
                        <div class="foto-upload-area" id="fotoUploadArea">
                            <img id="fotoPreview" src="../img/img-placeholder.png" alt="Vista previa" class="orador-foto-preview">
                            <label for="foto" class="btn-upload-foto">
                                <i class="bi bi-upload"></i> Subir foto desde PC
                            </label>
                            <input type="file" id="foto" accept="image/*" class="file-input-hidden">
                        </div>
                        <span class="form__error-message" id="error-foto"></span>
                    </div>

                    <div class="form-group">
                        <label for="actividad">Actividad a la que aplica</label>
                        <select id="actividad">
                            <option value="">Seleccionar actividad...</option>
                        </select>
                        <span class="form__error-message" id="error-actividad"></span>
                    </div>

                    <button type="submit" class="btn-primary">Enviar Postulación</button>
                </form>
            </section>

        </main>
    </div>

    <footer>
        <p>&copy; 2026 Universidad CENFOTEC. Todos los derechos reservados.</p>
    </footer>

    <script src="../js/data-store.js"></script>
    <script src="../js/validaciones.js"></script>
    <script src="../js/postular-participante-logic.js"></script>
</body>
</html>
