<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Presentadores</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/admin-layout.css">
    <link rel="stylesheet" href="../css/admin-oradores.css">
    <link rel="icon" type="image/svg" href="../img/CENFOTEC-FAVICON.svg">
</head>
<body>
    <!-- MENU LATERAL -->
    <nav class="navSideMenu">
        <div class="sideMenuHeader">
            <div>
                <img src="../img/eventos-cenfotec-icon-dark.png" alt="Logo Cenfotec" />
            </div>
            <div>
                <h2>Panel de Administrador</h2>
                <p>Gestión Académica</p>
            </div>
        </div>

        <hr class="menuSeparator" />

        <div class="sideMenuLinks">
            <a href="admin-eventos.html"><i class="bi bi-calendar"></i> Eventos</a>
            <a href="admin-actividades.html"><i class="bi bi-list-task"></i> Actividades</a>
            <a class="sideMenuActive" href="admin-oradores.html"><i class="bi bi-people-fill"></i> Presentadores</a>
            <a href="admin-stands.html"><i class="bi bi-shop-window"></i> Stands</a>
            <a href="admin-participantes.html"><i class="bi bi-person-check"></i> Participantes</a>
            <a href="admin-usuarios.html"><i class="bi bi-key"></i> Administradores</a>
        </div>

        <div class="sideMenuLinks">
            <hr class="menuSeparator" />
            <a href="../index.html" target="_blank"><i class="bi bi-house"></i> Sitio Público</a>
            <a id="btnLogOut" href="login.html"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="admin-main-content">

        <!-- Header / Topbar -->
        <header>
            <div class="headerTitle">
                <h1>Gestión de Presentadores</h1>
            </div>
            <div class="headerActions">
                <div class="headerSearchBar">
                    <button type="button"><i class="bi bi-search"></i></button>
                    <input type="text" placeholder="Buscar presentador..." id="searchInput">
                </div>
                <div class="headerAdminInfo">
                    <p class="userName" id="headerUserName">Nombre Admin</p>
                    <p class="userRol" id="headerUserRol">Rol</p>
                </div>
            </div>
        </header>

        <main class="admin-page-content">

            <section class="admin-toolbar">
                <div class="admin-toolbar__filters">
                    <select class="filter-select" id="filterEstado">
                        <option value="">Estado</option>
                        <option value="activo">Activo</option>
                        <option value="inactivo">Inactivo</option>
                    </select>
                    <input type="date" class="filter-select" id="filterFechaOrador" />
                </div>
                <div class="admin-toolbar__actions">
                    <button class="eventsAdminBtnSecondary" id="btnEditarOrador">Editar</button>
                    <button class="eventsAdminBtnSecondary btnDelete" id="btnEliminarOrador">Eliminar</button>
                    <button class="eventsAdminBtnPrimary" id="btnCrearOrador">
                        <i class="bi bi-plus-lg"></i> Crear Presentador
                    </button>
                </div>
            </section>

            <section class="admin-table-wrapper">
                <table class="admin-table" id="tabla-oradores">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="selectAll" title="Seleccionar todos"></th>
                            <th>Fecha Registro</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Teléfonos</th>
                            <th>Especialidad</th>
                            <th>Organización</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="adminOradoresTableBody">
                         <!-- Renderizado dinámicamente por JS -->
                    </tbody>
                </table>
            </section>

        </main>
    </div>

    <!-- MODAL REGISTRAR / EDITAR PRESENTADOR -->
    <div class="modal-overlay" id="modalCrearOrador">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalOradorTitulo">Registrar Presentador</h2>
                <button class="modal-close" id="btnCerrarModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-field">
                    <label for="inputNombreOrador">Nombre Completo</label>
                    <input type="text" id="inputNombreOrador" placeholder="Nombre del presentador">
                    <span class="form__error-message" id="error-inputNombreOrador"></span>
                </div>
                <div class="modal-field">
                    <label for="inputCorreoOrador">Correo Electrónico</label>
                    <input type="email" id="inputCorreoOrador" placeholder="correo@ejemplo.com">
                    <span class="form__error-message" id="error-inputCorreoOrador"></span>
                </div>
                <div class="modal-field">
                    <label for="inputTelefonoOrador">Teléfono Principal</label>
                    <input type="text" id="inputTelefonoOrador" placeholder="8888-8888">
                    <span class="form__error-message" id="error-inputTelefonoOrador"></span>
                </div>
                <div class="modal-field">
                    <label for="inputTelefono2Orador">Teléfono Secundario <span class="field-hint">(opcional)</span></label>
                    <input type="text" id="inputTelefono2Orador" placeholder="7777-7777">
                    <span class="form__error-message" id="error-inputTelefono2Orador"></span>
                </div>
                <div class="modal-field">
                    <label for="inputEspecialidadOrador">Área / Especialidad</label>
                    <input type="text" id="inputEspecialidadOrador" placeholder="Ej. Ingeniería de Software">
                    <span class="form__error-message" id="error-inputEspecialidadOrador"></span>
                </div>
                <div class="modal-field">
                    <label for="inputEmpresaOrador">Institución u Organización</label>
                    <input type="text" id="inputEmpresaOrador" placeholder="Nombre de la institución o empresa">
                    <span class="form__error-message" id="error-inputEmpresaOrador"></span>
                </div>
                <div class="modal-field">
                    <label for="inputBiografiaOrador">Biografía</label>
                    <textarea id="inputBiografiaOrador" rows="3" placeholder="Breve descripción del presentador (máx. 200 caracteres)"></textarea>
                    <span class="form__error-message" id="error-inputBiografiaOrador"></span>
                </div>
                <div class="modal-field">
                    <label>Fotografía</label>
                    <div class="foto-upload-area" id="fotoUploadArea">
                        <img id="fotoPreview" src="../img/img-placeholder.png" alt="Vista previa" class="orador-foto-preview">
                        <label for="inputFotoOrador" class="btn-upload-foto">
                            <i class="bi bi-upload"></i> Subir foto desde PC
                        </label>
                        <input type="file" id="inputFotoOrador" accept="image/*" class="file-input-hidden">
                    </div>
                    <span class="form__error-message" id="error-inputFotoOrador"></span>
                </div>
                <div class="modal-field">
                    <label for="inputEventoOrador">Evento / Actividad</label>
                    <select id="inputEventoOrador" class="filter-select modal-select-full">
                        <option value="">Seleccionar evento...</option>
                    </select>
                    <span class="form__error-message" id="error-inputEventoOrador"></span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn-cancelar" id="btnCancelarModal">Cancelar</button>
                <button class="modal-btn-registrar" id="btnGuardarOrador">Registrar</button>
            </div>
        </div>
    </div>

    <script src="../js/data-store.js"></script>
    <script src="../js/validaciones.js"></script>
    <script src="../js/admin-oradores-logic.js"></script>
</body>
</html>
